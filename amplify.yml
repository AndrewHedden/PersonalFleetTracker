# AWS Amplify Hosting build settings for Stablebook web.
# Pattern follows the official Amplify monorepo + pnpm + Next.js FAQ:
# https://github.com/aws-amplify/amplify-hosting/blob/main/FAQ.md#using-a-monorepo-framework
#
# Key bits:
#   - `buildPath: '/'` — run commands from the repo root so pnpm sees the
#     full workspace, then build the web workspace specifically.
#   - `baseDirectory: web/.next` — the artifacts path is relative to the
#     repo root, NOT the appRoot.
#   - `.npmrc` at repo root sets `node-linker=hoisted` so pnpm produces
#     a flat node_modules layout Amplify's SSR packager can read.

version: 1
applications:
  - appRoot: web
    frontend:
      buildPath: '/'
      phases:
        preBuild:
          commands:
            - npm install -g pnpm@11.3.0
        build:
          commands:
            # Materialize Amplify console env vars into web/.env.production so
            # Next.js loads them at runtime in the SSR Lambda. The console
            # vars are reliably available at build time but don't always
            # propagate to the Lambda runtime in monorepo SSR setups.
            - printenv | grep -E '^(NEXT_PUBLIC_AWS_REGION|COGNITO_USER_POOL_ID|COGNITO_APP_CLIENT_ID|COGNITO_DOMAIN_URL|API_URL|HANDOFF_SECRET)=' >> web/.env.production
            - cat web/.env.production
            - pnpm install --frozen-lockfile
            - pnpm --filter @stablebook/web build
      artifacts:
        baseDirectory: web/.next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - web/node_modules/**/*
          - web/.next/cache/**/*
